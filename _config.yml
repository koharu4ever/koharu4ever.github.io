title: Kral
subtitle:
description: Kral's personal site, projects and development notes
keywords:
author: Kral
language: zh-CN
timezone: Asia/Tokyo

url: https://koharu4ever.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
syntax_highlighter: highlight.js

index_generator:
  path: ''
  per_page: 10
  order_by: -date

search:
  path: search.json
  field: post
  content: true
  format: striptags

default_category: uncategorized
category_map:
tag_map:

date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

per_page: 10
pagination_dir: page

theme: butterfly

# Local development only: reload the browser after Hexo rebuilds a changed file.
browser_reloader_websocket:
  enable: true
  server:
    port: 4001

# Use Butterfly's built-in masonry cards, as seen on the reference site.
index_layout: 6

index_post_content:
  method: 2
  length: 180

aside:
  enable: true
  hide: false
  button: false
  mobile: false
  position: right
  display:
    archive: false
    tag: false
    category: false
  card_author:
    enable: true
    description: TypeScript / JavaScript · Kita · Homelab
    button: false
  card_announcement:
    enable: true
    content: |
      <div class="kral-now" aria-labelledby="kral-now-title">
        <h3 id="kral-now-title">NOW</h3>
        <dl>
          <div>
            <dt>Kita</dt>
            <dd>v1 已收尾，补内容、做维护</dd>
          </div>
          <div>
            <dt>.NET</dt>
            <dd>准备开始第一个完整项目</dd>
          </div>
          <div>
            <dt>Homelab</dt>
            <dd>给 Dell G3 准备长期运行环境</dd>
          </div>
        </dl>
      </div>
  card_recent_post:
    enable: true
    limit: 3
    sort: date
  card_newest_comments:
    enable: false
  card_categories:
    enable: true
    limit: 8
    expand: none
    sort_order: none
  card_tags:
    enable: true
    limit: 8
    color: false
    orderby: name
    order: 1
  card_archives:
    enable: false
  card_post_series:
    enable: true
    series_title: true
    orderBy: date
    order: 1
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    runtime_date: '2025/12/14 00:00:00'

comments:
  use: Giscus
  text: true
  lazyload: true
  count: false
  card_post_count: false

giscus:
  repo: koharu4ever/koharu4ever.github.io
  repo_id: R_kgDOP0cTOA
  category_id: DIC_kwDOP0cTOM4DDtyO
  light_theme: https://koharu4ever.github.io/css/giscus-koharu-light.css?v=5
  dark_theme: https://koharu4ever.github.io/css/giscus-koharu-dark.css?v=5
  option:
    data-category: Announcements
    data-mapping: pathname
    data-strict: '1'
    data-reactions-enabled: '1'
    data-emit-metadata: '0'
    data-input-position: bottom
    data-lang: zh-CN
    data-loading: lazy

share:
  use:

busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: false

toc:
  scroll_percent: false

mermaid:
  enable: true
  code_write: true
  theme:
    light: default
    dark: dark

search:
  use: local_search
  placeholder: 搜索文章
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false
    pagination:
      enable: false
      hitsPerPage: 8
    CDN:

darkmode:
  enable: true
  button: true
  autoChangeMode: false

rightside_scroll_percent: true

anchor:
  auto_update: false
  click_to_scroll: true


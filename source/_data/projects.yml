    overview:
      kicker: System
      paragraphs:
        - Kita 最初只是一张符合个人审美的首页，后来逐步加入内容管理、数据库、媒体存储和自托管部署。它现在既是实际使用的网站，也是我理解全栈项目边界的开发基座。
        - 项目不追求复杂服务拆分。Next.js 与 Payload 运行在同一应用中，PostgreSQL 保存结构化数据，Cloudflare R2 保存媒体对象；OpenList 保持为独立应用，只通过链接与 Kita 相连。
    architecture:
      kicker: System boundaries
      link:
        label: Full review →
        url: /2026/08/05/Kita-architecture-and-project-review/
      aria_label: 'Kita architecture: Browser connects to the Next.js and Payload application boundary; PostgreSQL stores structured data, Cloudflare R2 stores media, Coolify runs the application, and OpenList remains independent.'
      client:
        label: Client
        title: Browser
        note: Request · navigation · rendering
      boundary:
        title: Kita application boundary
        nodes:
          - label: Application
            title: Next.js
            note: Routes · server rendering · UI
          - label: Content
            title: Payload Local API
            note: Admin · collections · access
      storage:
        - label: Structured data
          title: PostgreSQL
          note: Content · relations · migrations
        - label: Object storage
          title: Cloudflare R2
          note: Payload Media · game covers
      runtime:
        label: Runtime / deployment
        title: Docker Compose · Coolify
      external:
        label: Independent relation
        title: OpenList Archive
        note: Separate application · URL-level connection only
      decisions:
        - subject: Application boundary
          choice: Next.js and Payload share one deployable application
          reason: Server rendering, Admin and content access stay in one runtime instead of creating a second backend service.
          tradeoff: Next.js and Payload upgrades must be verified together.
          url: /2026/08/02/kita-payload-local-api/
        - subject: Server data access
          choice: Payload Local API through server getters and mappers
          reason: The same Node process can read content without an internal HTTP hop, while mappers keep Payload documents out of UI components.
          tradeoff: Local API access must remain explicit; public getters use overrideAccess false and published filters.
          url: /2026/08/04/kita-real-request-path/
        - subject: Persistence boundary
          choice: PostgreSQL for structured data; Cloudflare R2 for media objects
          reason: Relations and metadata need a database, while uploaded media must outlive a replaceable application container.
          tradeoff: A complete recovery requires PostgreSQL metadata and R2 objects to be restored together.
          url: /2026/08/03/kita-media-r2/
        - subject: Archive boundary
          choice: OpenList remains an independent application connected by public URL
          reason: Resource browsing belongs in OpenList without sharing Kita's database, secrets, volume or deployment lifecycle.
          tradeoff: OpenList still needs its own monitoring, backup and upgrade plan.
          url: /2026/08/03/kita-openlist-boundary/
        - subject: Development environment
          choice: Dev Container with Docker-in-Docker and targeted Linux volumes
          reason: Node, pnpm and PostgreSQL stay reproducible while the Windows host only supplies Git, Docker and VS Code.
          tradeoff: DIND, volume ownership and Windows filesystem performance require explicit safeguards.
          url: /2026/08/02/kita-dev-container/
        - subject: Deployment boundary
          choice: Docker Compose describes services; Coolify builds and runs production
          reason: The deployable application, database and backup process have visible runtime relationships without adding an orchestrator.
          tradeoff: A successful build does not prove that migrations and the production runner can start.
          url: /2026/08/04/kita-case-production-runtime-dependency/
    run_locally:
      kicker: Local development
      title: Run Kita locally
      nav_label: Build & run
      intro: Windows 只负责保存源码和运行 Docker Desktop；Node、pnpm、PostgreSQL 与项目命令都留在可重建的 Dev Container 边界内。
      command:
        label: Development server
        value: pnpm dev
      items:
        - label: Host requirements
          value: Git · Docker Desktop · VS Code · Dev Containers
          note: Windows 不需要全局安装 Node、pnpm、Payload 或 PostgreSQL。
        - label: Toolchain
          value: Node 22 · pnpm 10.28.2 · remoteUser node
          note: Corepack 与 frozen lockfile 固定依赖入口；日常命令拒绝使用 root。
        - label: Development services
          value: Dev Container → DIND → PostgreSQL 16
          note: compose.dev.yaml 只在开发环境映射 localhost:5432，生产不公开数据库端口。
        - label: Environment contract
          value: .env.example → .env
          note: .env 保存本机真实值且不进入 Git 或 Docker build context；生产值由 Coolify Runtime Variables 提供。
      links:
        - label: Command guide ↗
          url: /2026/08/04/kita-basics-command-guide/
        - label: Dev Container rationale ↗
          url: /2026/08/02/kita-dev-container/
        - label: Environment contract ↗
          url: /2026/08/04/kita-basics-environment-variables/
      steps:
        - label: Open the workspace
          command: 'Dev Containers: Reopen in Container'
          note: 等待 postCreate 完成依赖安装，并确认工作区用户是 node。
        - label: Create local configuration
          command: .env.example → .env
          note: 填写本地数据库和 Payload 值；默认使用 local media，不复制生产 R2 secret。
        - label: Start the application
          command: pnpm dev
          note: 用户守卫先检查工作区，再启动并等待 PostgreSQL healthy，最后运行 Next.js。
        - label: Run quality gates
          command: pnpm check && pnpm test
          note: format、lint、typecheck 与测试是不同证据，不能互相替代。
        - label: Verify the production build
          command: pnpm build
          note: 先停止开发服务器，避免两个进程同时写入 .next。
      checks:
        - label: Runtime identity
          value: whoami · node --version · pnpm --version
          note: 预期用户为 node，Node 为 22.x，pnpm 与 packageManager 声明一致。
        - label: PostgreSQL health
          value: docker compose -f compose.yaml -f compose.dev.yaml ps
          note: postgres 必须为 healthy；running 不等于已经可以接受连接。
        - label: Application surfaces
          value: http://localhost:3000 · /admin
          note: 同时检查公开页面、Payload Admin 和一个真实依赖数据库的页面。
    configuration:
      kicker: Repository map & environment contract
      title: Project structure & configuration
      intro: 目录按框架入口、业务功能与运行边界分层；环境变量表只公开键名、安全默认值和用途，不保存任何真实 secret。
      items:
        - label: Commands & dependency baseline
          value: package.json · pnpm-lock.yaml
          note: 固定脚本入口、packageManager 与可复现依赖解析结果。
        - label: Routes & composition
          value: src/app
          note: App Router 的 page、layout、metadata、错误状态和 Payload 路由；不堆查询与复杂 UI。
        - label: Feature modules
          value: src/features
          note: 按 Games、Reviews、Tools 等真实业务聚合 UI、types、utils、data 与就近测试。
        - label: Server-only reads
          value: src/server
          note: 集中 Payload Local API、published filter、排序、fallback 和 mapper，不让页面组件直接依赖 CMS document。
        - label: CMS schema & access
          value: src/payload
          note: Collections、access rules 与生成的 Payload types；生成文件不手工修改。
        - label: Validated runtime config
          value: src/config
          note: Zod 与 @t3-oss/env-nextjs 统一验证 env 和 Media local/R2 模式，普通源码不直接读取 process.env。
        - label: Database evolution
          value: src/migrations
          note: 进入 Git 的 up/down schema 历史；production entrypoint 先执行 migration 再启动 Web Server。
        - label: Development & production runtime
          value: .devcontainer/devcontainer.json · compose.yaml · compose.dev.yaml · Dockerfile
          note: Dev Container 固定工具链，Compose 区分本地端口差异，Dockerfile 定义精简生产 runner。
      parameters:
        - key: NEXT_PUBLIC_SITE_URL
          source: .env.example → .env / Coolify
          scope: Public build
          required: true
          default: http://localhost:3000
          effect: 允许进入浏览器 bundle 的站点 URL；不能承载任何 secret。
          apply: Rebuild
        - key: PAYLOAD_SECRET
          source: .env.example → .env / Coolify
          scope: Server runtime
          required: true
          secret: true
          effect: Payload 的服务端 secret，至少 32 字符；生产值必须稳定。
          apply: Restart
        - key: ENABLE_DEV_SEED
          source: .env.example → .env
          scope: Development only
          required: false
          default: 'false'
          effect: 只有非 production 且显式为 true 时才允许开发 seed。
          apply: Restart
        - key: POSTGRES_DB
          source: .env.example → .env / Coolify
          scope: Database initialization
          required: true
          default: kita
          effect: PostgreSQL 首次初始化的数据库名，必须与 DATABASE_URI 对应。
          apply: First initialization
        - key: POSTGRES_USER
          source: .env.example → .env / Coolify
          scope: Database initialization
          required: true
          default: postgres
          effect: PostgreSQL 首次初始化用户，必须与 DATABASE_URI 对应。
          apply: First initialization
        - key: POSTGRES_PASSWORD
          source: .env.example → .env / Coolify
          scope: Database initialization
          required: true
          secret: true
          effect: 只在空数据目录首次初始化时设置数据库密码；修改变量不会自动轮换已有用户。
          apply: Database rotation
        - key: DATABASE_URI
          source: .env.example → .env / Coolify
          scope: Server runtime
          required: true
          secret: true
          effect: 应用连接 PostgreSQL；本地 host 为 localhost，生产 Compose host 为 postgres。
          apply: Restart
        - key: MEDIA_STORAGE_MODE
          source: .env.example → .env / Coolify
          scope: Media runtime
          required: true
          default: local
          effect: local 写入开发目录；生产选择 r2 后会强制检查完整 R2 配置。
          apply: Restart
        - key: MEDIA_R2_BUCKET
          source: .env.example → .env / Coolify
          scope: Media runtime
          effect: MEDIA_STORAGE_MODE=r2 时指定 Payload Media 的对象 bucket。
          apply: Restart
        - key: MEDIA_R2_ENDPOINT
          source: .env.example → .env / Coolify
          scope: Media runtime
          effect: R2 的 S3-compatible API endpoint，不是公开图片 URL。
          apply: Restart
        - key: MEDIA_R2_PUBLIC_URL
          source: .env.example → .env / Coolify
          scope: Public media
          effect: 浏览器和 Next Image 使用的公开 custom domain。
          apply: Rebuild & restart
        - key: MEDIA_R2_ACCESS_KEY_ID / MEDIA_R2_SECRET_ACCESS_KEY
          source: .env.example → .env / Coolify
          scope: Server runtime
          secret: true
          effect: 仅在 r2 模式下提供给服务端 storage adapter；不得进入 NEXT_PUBLIC、文档或日志。
          apply: Restart
    troubleshooting:
      title: Startup & runtime troubleshooting
      items:
        - title: Port 5432 is already in use
          status: Check
          cause: 另一套本地 PostgreSQL 或另一个项目占用了开发 override 要映射的端口。
          checks:
            - 先确认端口占用者和当前 Docker context，不要启动多套数据库再猜测连接目标。
            - 检查 compose.dev.yaml 是否仍只暴露开发所需的 PostgreSQL 端口。
          resolution:
            - 停止重复服务，或有意识地修改开发 override 与 DATABASE_URI。
            - 重新运行 pnpm dev，并等待 PostgreSQL healthcheck 通过。
        - title: PostgreSQL is running, but Payload cannot connect
          status: Check
          cause: 容器只有 running 但尚未 healthy，或者 DATABASE_URI 的 host、用户、密码、数据库名与运行位置不一致。
          checks:
            - 在 Dev Container 中查看 Compose 状态与 PostgreSQL logs。
            - 本地 Next.js 使用 localhost；生产 Compose 内部服务使用 postgres。
          resolution:
            - 使用 --wait 等待 healthcheck，而不是仅判断容器进程存在。
            - 让 POSTGRES_DB、POSTGRES_USER、POSTGRES_PASSWORD 与 DATABASE_URI 保持同一组值。
          command: docker compose -f compose.yaml -f compose.dev.yaml ps
        - title: POSTGRES_PASSWORD changed, but authentication still fails
          status: Caution
          cause: PostgreSQL 官方镜像只在空 data volume 首次初始化时应用 POSTGRES_PASSWORD；修改环境变量不会改动已有数据库用户。
          checks:
            - 先确认 volume 中的数据是否需要保留，并核对当前数据库用户。
          resolution:
            - 在数据库内部正确轮换用户密码。
            - 同步更新 DATABASE_URI 与运行时 secret，再重启应用。
            - 只有确认开发数据可丢弃时，才考虑重建 volume。
        - title: Build succeeds, but production returns 503
          status: Resolved
          cause: Payload migration 在精简 runner 中导入了未被 selective COPY 带入的源码，entrypoint 在启动 Next Server 前退出。
          checks:
            - 先看 Coolify runtime log，不要只重复查看成功的 build log。
            - 区分 builder 文件系统、runner 文件系统与 Payload CLI 的运行时 import 路径。
          resolution:
            - 移除不必要的跨层 import，或把 migration 实际需要的源码复制进 runner。
            - 用接近生产 runner 的最小文件集合验证 Payload config 和 migration 能加载。
            - 重新构建镜像并确认 container 通过 migration 后开始监听端口。
          command: pnpm build
    articles:
      link:
        label: Technical Notes →
        url: /notes/
      items:
        - date: '2026.08.05'
          type: Reference
          title: Kita 项目整体架构、数据流与边界审查

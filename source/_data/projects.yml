      steps:
        - label: Deploy the upstream application
          note: Use the official OpenList image as an independent Docker or Coolify application.
        - label: Attach persistent state
          note: Keep the OpenList data volume outside Kita and include it in the service backup boundary.
        - label: Configure the instance

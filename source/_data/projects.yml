      aria_label: 'Kral Publishing System architecture: the author workspace contains Markdown, YAML and images; Hexo and custom generators turn those sources into a Butterfly-based static site; the Dev Container provides the build environment; GitHub Actions publishes the output to GitHub Pages.'

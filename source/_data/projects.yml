        - 这个仓库不再只是几份 Hexo 配置。Markdown 文章、项目数据、图片资产、构建期生成器和主题定制共同组成了一套可重复维护的个人发布系统；博客、技术档案、项目数据库和简历都由同一份源码生成。
        - 它仍然坚持静态站点的边界：本地只维护内容和生成规则，Hexo 输出普通 HTML、CSS 与 JavaScript，GitHub Actions 负责可重复构建，GitHub Pages 只托管最终产物。复杂度集中在构建期，而不是转移给浏览器或服务器。

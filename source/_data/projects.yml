    run_locally:
      kicker: Local workflow
      title: Run the publishing system
      nav_label: Build & publish
      intro: Development is container-first. The host opens the repository, while Node, pnpm and Hexo run as the non-root node user inside the Dev Container.
      command:
        label: Preview with drafts
        value: pnpm dev
      items:
        - label: Requirements
          value: Git · Docker · VS Code · Dev Containers
          note: The host does not need a global Node, pnpm or Hexo installation.
        - label: Environment
          value: 'Dev Containers: Reopen in Container'
          note: postCreate enables Corepack and installs the locked pnpm dependencies.
        - label: Preview
          value: http://localhost:4000
          note: Port 4001 is reserved for the browser reload connection.
        - label: Verification
          value: pnpm check
          note: Runs formatting checks, ESLint and a clean production build.
      links:
        - label: Getting started ↗
          url: /2026/08/08/kral-publishing-system-getting-started/
      steps:
        - label: Open the source workspace
          command: 'Dev Containers: Reopen in Container'
          note: The normal workspace user is node; the host does not need Node or Hexo.
        - label: Preview content and drafts
          command: pnpm dev
          note: Hexo serves the site on port 4000 and uses port 4001 for reload events.
        - label: Validate the source
          command: pnpm check
          note: Runs Prettier check, ESLint and a clean production build.
        - label: Publish through the source branch
          command: git push origin main
          note: GitHub Actions builds and deploys the public artifact; generated public files are not committed.
      checks:
        - label: Local preview
          value: http://localhost:4000
          note: Drafts are included only in the local development command.
        - label: Production artifact
          value: public/
          note: Generated by pnpm build and treated as disposable output.
        - label: Deployment
          value: GitHub Actions
          note: Build success and Pages deployment success remain separate states.
    configuration:
      kicker: Repository map
      title: Structure & configuration
      intro: Content, project records, theme settings and build extensions each have one visible source location. Generated public files are never the editing surface.
      items:
        - label: Articles
          value: source/_posts/*.md
          note: Markdown content and Front Matter.
        - label: Projects
          value: source/_data/projects.yml
          note: One data source generates the index and every project record.
        - label: Images
          value: source/img/

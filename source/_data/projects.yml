    url: /projects/kita/
    title: Kita
    page_title: Kita · Project Database
    subtitle: A personal content system
    description: 一个围绕游戏、小众文化和个人内容持续演进的全栈项目。
    summary:
      what: 为 Games、Reviews、Tools 与 Media 提供内容管理、公开展示和长期维护的一体化系统。
      why: 把内容模型、结构化数据、媒体存储和自托管部署收敛在一套可以持续演进的工程中。
      boundary: OpenList 保持独立；Kita 只保存并跳转公开 URL，不共享数据库或部署生命周期。
